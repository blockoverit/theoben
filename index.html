<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theo vs Ben Series</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        body { 
            background-color: #f3f4f6; 
            color: #1a1a1a; 
            font-family: 'Inter', sans-serif; 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-content {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .card-shadow {
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="p-6 md:p-12 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-3xl mx-auto">
        <header class="mb-8">
            <h1 class="text-4xl font-extrabold tracking-tight text-gray-900">Theo vs Ben</h1>
            <p class="text-lg text-gray-500 font-medium mt-2">Series Scoreboard</p>
        </header>
        
        <nav id="tab-bar" class="flex gap-1 mb-6 overflow-x-auto pb-2">
            <!-- Tabs injected here -->
        </nav>
        
        <main id="content" class="bg-white rounded-3xl card-shadow p-8 md:p-12 min-h-[450px] flex flex-col justify-between">
            <!-- Content injected here -->
        </main>
    </div>

    <script>
        const tournamentData = [
            { 
                "name": "Uriage Poolside", 
                "date": "July 11, 2026", 
                "logo": "uriage.png", 
                "scores": { "Theo": [11, 11], "Ben": [8, 5] },
                "theme": "blue" 
            },
            { 
                "name": "Touchmark", 
                "date": "July 31, 2026", 
                "logo": "touchmark.png", 
                "scores": null,
                "theme": "green"
            },
            { 
                "name": "Portland Garage", 
                "date": "August 15, 2026", 
                "logo": "portland.png", 
                "scores": null,
                "theme": "gray"
            }
        ];

        let currentIndex = 0;

        function render() {
            const tabBar = document.getElementById('tab-bar');
            const content = document.getElementById('content');
            
            tabBar.innerHTML = '';
            tournamentData.forEach((t, i) => {
                const btn = document.createElement('button');
                // Browser-tab style navigation
                const isActive = i === currentIndex;
                btn.className = `px-6 py-3 text-base font-semibold rounded-t-2xl transition-all duration-200 whitespace-nowrap ${
                    isActive 
                        ? 'bg-white text-gray-900 shadow-[0_-4px_10px_-5px_rgba(0,0,0,0.1)]' 
                        : 'bg-gray-200 text-gray-500 hover:bg-gray-300'
                }`;
                btn.innerText = t.name;
                btn.onclick = () => { if (currentIndex !== i) { currentIndex = i; render(); } };
                tabBar.appendChild(btn);
            });

            const current = tournamentData[currentIndex];
            content.className = 'bg-white rounded-b-3xl rounded-tr-3xl card-shadow p-8 md:p-12 min-h-[450px] flex flex-col justify-between animate-content';
            
            // Define theme colors
            const themes = {
                blue: { primary: 'text-blue-600', bg: 'bg-blue-600', highlight: 'bg-blue-50', text: 'text-blue-700', border: 'border-blue-100' },
                green: { primary: 'text-green-700', bg: 'bg-green-700', highlight: 'bg-green-50', text: 'text-green-800', border: 'border-green-100' },
                gray: { primary: 'text-gray-700', bg: 'bg-gray-700', highlight: 'bg-gray-100', text: 'text-gray-800', border: 'border-gray-100' }
            };
            const theme = themes[current.theme];

            let html = `
                <div>
                    <div class="flex items-center gap-6 mb-10 pb-8 border-b border-gray-100">
                        <div class="w-24 h-24 rounded-3xl bg-gray-100 flex items-center justify-center text-gray-400 font-bold overflow-hidden shadow-inner">
                            <img src="${current.logo}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\'text-2xl\'>🏆</span>'" class="w-full h-full object-cover">
                        </div>
                        <div>
                            <span class="inline-block px-4 py-1.5 ${theme.bg} text-white font-bold text-xs uppercase tracking-wider rounded-lg mb-2">
                                ${current.date}
                            </span>
                            <h2 class="text-4xl font-extrabold text-gray-900 tracking-tight">${current.name}</h2>
                        </div>
                    </div>
            `;

            if (current.scores) {
                let theoSets = 0;
                let benSets = 0;
                const numSets = current.scores.Theo.length;
                
                for(let i = 0; i < numSets; i++) {
                    if (current.scores.Theo[i] > current.scores.Ben[i]) theoSets++;
                    else if (current.scores.Ben[i] > current.scores.Theo[i]) benSets++;
                }

                const getWinnerBadge = (name) => {
                    if (name === 'THEO' && theoSets > benSets) return `<span class="ml-4 px-3 py-1 ${theme.bg} text-white rounded-lg text-xs font-bold uppercase tracking-wider shadow-sm">Winner</span>`;
                    if (name === 'BEN' && benSets > theoSets) return `<span class="ml-4 px-3 py-1 ${theme.bg} text-white rounded-lg text-xs font-bold uppercase tracking-wider shadow-sm">Winner</span>`;
                    return '';
                };

                let setHeaders = '';
                for(let i = 1; i <= numSets; i++) setHeaders += `<div class="text-center font-bold text-sm text-gray-400 uppercase tracking-wider">Set ${i}</div>`;

                let theoCells = '';
                let benCells = '';
                for(let i = 0; i < numSets; i++) {
                    const isTheoWinning = current.scores.Theo[i] > current.scores.Ben[i];
                    const isBenWinning = current.scores.Ben[i] > current.scores.Theo[i];
                    theoCells += `<div class="text-center font-extrabold text-2xl py-5 rounded-2xl transition-colors ${isTheoWinning ? `${theme.highlight} ${theme.text}` : 'text-gray-400'}">${current.scores.Theo[i]}</div>`;
                    benCells += `<div class="text-center font-extrabold text-2xl py-5 rounded-2xl transition-colors ${isBenWinning ? `${theme.highlight} ${theme.text}` : 'text-gray-400'}">${current.scores.Ben[i]}</div>`;
                }

                html += `
                    <div class="grid grid-cols-[1fr_repeat(${numSets},80px)] gap-4 items-center">
                        <div></div>
                        ${setHeaders}
                        <div class="font-extrabold text-2xl text-gray-900 flex items-center">THEO ${getWinnerBadge('THEO')}</div>
                        ${theoCells}
                        <div class="font-extrabold text-2xl text-gray-900 flex items-center">BEN ${getWinnerBadge('BEN')}</div>
                        ${benCells}
                    </div>
                `;
            } else {
                html += `
                    <div class="my-auto py-20 border-2 border-dashed border-gray-200 rounded-3xl bg-gray-50 flex flex-col items-center justify-center text-center">
                        <h3 class="text-2xl font-extrabold text-gray-900 mb-2">Match Scheduled</h3>
                        <p class="text-lg text-gray-500 font-medium">Scores will appear after the game</p>
                    </div>
                `;
            }
            
            html += `</div>`;
            content.innerHTML = html;
        }

        window.onload = render;
    </script>
</body>
</html>
