<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theo vs Ben Series</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        body { 
            background-color: #f8f9fa; 
            color: #1a1a1a; 
            font-family: 'Inter', sans-serif; 
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-content {
            animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .card-shadow {
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 4px 12px -2px rgba(0, 0, 0, 0.02);
        }

        .winner-badge {
            background-color: #059669;
            color: white;
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .score-highlight {
            background-color: #e8f5e9;
            color: #059669;
            font-weight: 800;
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-2xl mx-auto py-4">
        <header class="mb-6 md:mb-8">
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-gray-900">Theo vs Ben</h1>
            <p class="text-base text-gray-500 font-medium mt-1">Series Scoreboard</p>
        </header>
        
        <nav id="tab-bar" class="flex gap-2.5 mb-6 overflow-x-auto pb-3 scrollbar-hide">
            <!-- Tabs injected here -->
        </nav>
        
        <main id="content" class="bg-white rounded-3xl card-shadow p-6 md:p-10 min-h-[380px] flex flex-col justify-between">
            <!-- Content injected here -->
        </main>
    </div>

    <script>
        const tournamentData = [
            { 
                "name": "Uriage Poolside", 
                "date": "July 11, 2026", 
                "logo": "uriage.png", 
                "scores": { "Theo": [11, 11], "Ben": [8, 5] }
            },
            { 
                "name": "Touchmark", 
                "date": "July 31, 2026", 
                "logo": "touchmark.png", 
                "scores": null
            },
            { 
                "name": "Portland Garage", 
                "date": "August 15, 2026", 
                "logo": "portland.png", 
                "scores": null 
            }
        ];

        let currentIndex = 0;

        function render() {
            const tabBar = document.getElementById('tab-bar');
            const content = document.getElementById('content');
            
            // Render Tabs
            tabBar.innerHTML = '';
            tournamentData.forEach((t, i) => {
                const btn = document.createElement('button');
                btn.className = `px-5 py-3 text-sm md:text-base font-semibold rounded-2xl transition-all duration-200 whitespace-nowrap ${
                    i === currentIndex 
                        ? 'bg-gray-900 text-white shadow-md scale-[1.02]' 
                        : 'bg-gray-100 text-gray-600 hover:bg-gray-200 hover:text-gray-900'
                }`;
                btn.innerText = t.name;
                btn.onclick = () => { 
                    if (currentIndex !== i) {
                        currentIndex = i; 
                        render(); 
                    }
                };
                tabBar.appendChild(btn);
            });

            const current = tournamentData[currentIndex];
            
            // Trigger animation rebuild
            content.className = 'bg-white rounded-3xl card-shadow p-6 md:p-10 min-h-[380px] flex flex-col justify-between animate-content';
            
            let html = `
                <div>
                    <!-- Header Section with Larger Logo and Date -->
                    <div class="flex items-center gap-5 mb-8 pb-6 border-b border-gray-100">
                        <img src="${current.logo}" alt="${current.name} Logo" class="w-16 h-16 md:w-20 md:h-20 rounded-2xl object-cover shadow-sm">
                        <div>
                            <span class="inline-block px-3 py-1 bg-green-50 text-green-700 font-bold text-xs uppercase tracking-wider rounded-lg mb-1">
                                ${current.date}
                            </span>
                            <h2 class="text-2xl md:text-3xl font-extrabold text-gray-900 tracking-tight">${current.name}</h2>
                        </div>
                    </div>
            `;

            if (current.scores) {
                let theoSets = 0;
                let benSets = 0;
                const numSets = current.scores.Theo.length;
                
                // Calculate set wins based on higher score per set
                for(let i = 0; i < numSets; i++) {
                    if (current.scores.Theo[i] > current.scores.Ben[i]) theoSets++;
                    else if (current.scores.Ben[i] > current.scores.Theo[i]) benSets++;
                }

                const getWinnerBadge = (name) => {
                    if (name === 'THEO' && theoSets > benSets) return '<span class="winner-badge ml-3 shadow-sm">Winner</span>';
                    if (name === 'BEN' && benSets > theoSets) return '<span class="winner-badge ml-3 shadow-sm">Winner</span>';
                    return '';
                };

                // Highlight the HIGHER score in each set
                const getScoreClass = (myScore, opponentScore) => {
                    return myScore > opponentScore 
                        ? 'score-highlight shadow-sm' 
                        : 'text-gray-400 bg-gray-50';
                };

                // Dynamic set headers (S1, S2, S3...)
                let setHeaders = '';
                for(let i = 1; i <= numSets; i++) {
                    setHeaders += `<div class="text-center font-bold text-xs md:text-sm text-gray-400 uppercase tracking-wider">Set ${i}</div>`;
                }

                // Dynamic score cells
                let theoCells = '';
                let benCells = '';
                for(let i = 0; i < numSets; i++) {
                    theoCells += `<div class="text-center font-bold text-lg md:text-xl py-3.5 rounded-xl transition-colors ${getScoreClass(current.scores.Theo[i], current.scores.Ben[i])}">${current.scores.Theo[i]}</div>`;
                    benCells += `<div class="text-center font-bold text-lg md:text-xl py-3.5 rounded-xl transition-colors ${getScoreClass(current.scores.Ben[i], current.scores.Theo[i])}">${current.scores.Ben[i]}</div>`;
                }

                html += `
                    <div class="grid grid-cols-[1fr_repeat(${numSets},52px)] md:grid-cols-[1fr_repeat(${numSets},64px)] gap-3 items-center">
                        <div></div>
                        ${setHeaders}
                        
                        <!-- THEO ROW (TOP) -->
                        <div class="font-extrabold text-lg md:text-xl text-gray-900 flex items-center">
                            THEO ${getWinnerBadge('THEO')}
                        </div>
                        ${theoCells}
                        
                        <!-- BEN ROW (BOTTOM) -->
                        <div class="font-extrabold text-lg md:text-xl text-gray-900 flex items-center">
                            BEN ${getWinnerBadge('BEN')}
                        </div>
                        ${benCells}
                    </div>
                `;
            } else {
                html += `
                    <div class="my-auto py-12 md:py-16 border-2 border-dashed border-gray-200 rounded-2xl bg-gray-50/50 flex flex-col items-center justify-center text-center">
                        <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800 mb-3 tracking-wide uppercase">
                            Upcoming Event
                        </span>
                        <h3 class="text-xl md:text-2xl font-extrabold text-gray-900 mb-1">Match Scheduled</h3>
                        <p class="text-sm md:text-base text-gray-500 font-medium">Scores not available yet</p>
                    </div>
                `;
            }
            
            html += `</div>`;
            content.innerHTML = html;
        }

        window.onload = render;
    </script>
</body>
</html>
