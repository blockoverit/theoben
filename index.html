<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theo vs Ben Series</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-content { animation: slideUp 0.4s ease-out forwards; }
        
        .tab-transition { transition: all 0.2s ease-in-out; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-3xl mx-auto">
        <header class="mb-8">
            <h1 class="text-4xl font-extrabold tracking-tight text-gray-900">Theo vs Ben</h1>
            <p class="text-lg text-gray-500 font-medium mt-1">Tournament Series Scoreboard</p>
        </header>
        
        <nav id="tab-bar" class="flex gap-1 mb-0 overflow-x-auto pb-0">
        </nav>
        
        <main id="content" class="bg-white rounded-3xl rounded-tl-none shadow-2xl p-8 md:p-12 min-h-[400px] flex flex-col">
        </main>
    </div>

    <script>
        const tournamentData = [
            { 
                "name": "Uriage Poolside", 
                "date": "July 11, 2026", 
                "logo": "uriage.png", 
                "scores": { "Theo": [11, 11], "Ben": [8, 5] },
                "theme": "blue" 
            },
            { 
                "name": "Touchmark", 
                "date": "July 31, 2026", 
                "logo": "touchmarktournament.png", 
                "scores": null,
                "theme": "green"
            },
            { 
                "name": "Bellevue", 
                "date": "canceled", 
                "logo": "bellevue.png", 
                "scores": null,
                "theme": "red"
            }
            { 
                "name": "Portland Garage", 
                "date": "August 15, 2026", 
                "logo": "portland.png", 
                "scores": null,
                "theme": "gray"
            }
        ];

        let currentIndex = 0;

        const themes = {
            blue: { bg: 'bg-blue-600', text: 'text-blue-600', highlight: 'bg-blue-100', textHighlight: 'text-blue-700', border: 'border-blue-100' },
            green: { bg: 'bg-green-700', text: 'text-green-700', highlight: 'bg-green-100', textHighlight: 'text-green-800', border: 'border-green-100' },
            gray: { bg: 'bg-gray-600', text: 'text-gray-600', highlight: 'bg-gray-100', textHighlight: 'text-gray-700', border: 'border-gray-100' }
        };

        function render() {
            const tabBar = document.getElementById('tab-bar');
            const content = document.getElementById('content');
            
            // Render Tabs
            tabBar.innerHTML = '';
            tournamentData.forEach((t, i) => {
                const isActive = i === currentIndex;
                const btn = document.createElement('button');
                btn.className = `px-6 py-3 text-sm font-bold rounded-t-2xl tab-transition whitespace-nowrap ${
                    isActive 
                        ? 'bg-white text-gray-900 shadow-lg z-10' 
                        : 'bg-gray-200 text-gray-500 hover:bg-gray-300'
                }`;
                btn.innerText = t.name;
                btn.onclick = () => { if (currentIndex !== i) { currentIndex = i; render(); } };
                tabBar.appendChild(btn);
            });

            const current = tournamentData[currentIndex];
            const theme = themes[current.theme];

            const isCanceled = String(current.date).toLowerCase() === 'canceled';

            let html = `
                <div class="animate-content flex items-center gap-6 mb-10 pb-8 border-b border-gray-100">
                    <div class="w-20 h-20 rounded-2xl bg-gray-100 flex items-center justify-center font-bold overflow-hidden shadow-inner border border-gray-100">
                        <img src="${current.logo}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\'text-2xl\'>🎾</span>'" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <span class="inline-block px-3 py-1 ${isCanceled ? 'bg-red-600' : theme.bg} text-white font-bold text-xs uppercase tracking-wider rounded-lg mb-2">
                            ${isCanceled ? 'Canceled' : current.date}
                        </span>
                        <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">${current.name}</h2>
                    </div>
                </div>
            `;

            if (isCanceled) {
                html += `
                    <div class="animate-content my-auto py-16 border-2 border-dashed border-red-200 rounded-3xl bg-red-50 flex flex-col items-center justify-center text-center">
                        <div class="text-5xl mb-4">🚫</div>
                        <h3 class="text-2xl font-extrabold text-red-700 mb-2">Tournament Canceled</h3>
                        <p class="text-lg text-red-500 font-medium">This event has been canceled and scores will not be recorded.</p>
                    </div>
                `;
            } else if (current.scores) {
                const numSets = current.scores.Theo.length;
                let theoSets = 0;
                let benSets = 0;
                
                for(let i = 0; i < numSets; i++) {
                    if (current.scores.Theo[i] > current.scores.Ben[i]) theoSets++;
                    else if (current.scores.Ben[i] > current.scores.Theo[i]) benSets++;
                }

                // Winner badge helpers
                const theoWinnerBadge = theoSets > benSets ? `<span class="ml-3 px-3 py-1 ${theme.bg} text-white rounded-md text-[10px] font-bold uppercase tracking-wider leading-none">Winner</span>` : '';
                const benWinnerBadge = benSets > theoSets ? `<span class="ml-3 px-3 py-1 ${theme.bg} text-white rounded-md text-[10px] font-bold uppercase tracking-wider leading-none">Winner</span>` : '';

                // Helper for conditional classes: Highlight higher score
                const getScoreClass = (score, opponentScore) => {
                    if (score > opponentScore) return `${theme.highlight} ${theme.textHighlight} font-bold`;
                    return 'text-gray-400 font-medium';
                };

                let setHeaders = '';
                for(let i = 1; i <= numSets; i++) setHeaders += `<div class="text-center font-bold text-xs text-gray-400 uppercase tracking-wider">Set ${i}</div>`;

                let theoCells = '';
                let benCells = '';
                for(let i = 0; i < numSets; i++) {
                    const tScore = current.scores.Theo[i];
                    const bScore = current.scores.Ben[i];
                    theoCells += `<div class="text-center text-2xl py-4 rounded-xl ${getScoreClass(tScore, bScore)}">${tScore}</div>`;
                    benCells += `<div class="text-center text-2xl py-4 rounded-xl ${getScoreClass(bScore, tScore)}">${bScore}</div>`;
                }

                html += `
                    <div class="animate-content grid grid-cols-[1fr_repeat(${numSets},70px)] gap-4 items-center">
                        <div></div>
                        ${setHeaders}
                        
                        <div class="flex items-center text-xl font-extrabold text-gray-900">
                            THEO ${theoWinnerBadge}
                        </div>
                        ${theoCells}
                        
                        <div class="flex items-center text-xl font-extrabold text-gray-900">
                            BEN ${benWinnerBadge}
                        </div>
                        ${benCells}
                    </div>
                `;
            } else {
                html += `
                    <div class="animate-content my-auto py-16 border-2 border-dashed border-gray-200 rounded-3xl bg-gray-50 flex flex-col items-center justify-center text-center">
                        <h3 class="text-2xl font-extrabold text-gray-900 mb-2">Match Scheduled</h3>
                        <p class="text-lg text-gray-500 font-medium">Scores will appear here after the match concludes.</p>
                    </div>
                `;
            }
            
            content.innerHTML = html;
        }

        window.onload = render;
    </script>
</body>
</html>
