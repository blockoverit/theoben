<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ben vs Theo Table Tennis Series</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .score-grid { 
            display: grid; 
            grid-template-columns: 1fr repeat(2, 3rem) 3rem; 
            background-color: #0f4c39;
        }
        .set-header { background-color: #2d7a62; }
        .player-row { border-bottom: 1px solid rgba(255,255,255,0.1); }
        .score-val { font-variant-numeric: tabular-nums; }
    </style>
</head>
<body class="p-4 md:p-12">

    <div class="max-w-2xl mx-auto space-y-8">
        <header class="mb-10">
            <h1 class="text-4xl font-bold text-slate-900 tracking-tight">Ben vs Theo</h1>
            <p class="text-slate-500 font-medium">Table Tennis Tournament Series</p>
        </header>

        <div id="tournament-list" class="space-y-6"></div>
    </div>

    <script>
        // Tournament data definition
        const tournamentData = [
            { 
                "name": "Uriage Poolside", 
                "date": "July 11, 2026", 
                "logo": "uriage.png", 
                "scores": { "Theo": [11, 11], "Ben": [8, 5] } 
            },
            { 
                "name": "Touchmark Tournament", 
                "date": "July 31, 2026", 
                "logo": "touchmark.png", 
                "scores": null 
            },
            { 
                "name": "Portland Garage", 
                "date": "August 15, 2026", 
                "logo": "portland.png", 
                "scores": null 
            }
        ];

        function renderData() {
            const list = document.getElementById('tournament-list');
            list.innerHTML = '';
            
            tournamentData.forEach(t => {
                const div = document.createElement('div');
                div.className = "bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden";
                
                if (t.scores) {
                    // Scoreboard layout
                    div.innerHTML = `
                        <div class="px-5 py-3 bg-slate-100 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase tracking-widest">${t.name}</div>
                        <div class="score-grid text-white font-bold text-lg">
                            <div class="set-header px-5 py-2 text-[10px] opacity-70 uppercase tracking-widest flex items-center">Player</div>
                            <div class="set-header py-2 text-center text-[10px] opacity-70 uppercase tracking-widest">S1</div>
                            <div class="set-header py-2 text-center text-[10px] opacity-70 uppercase tracking-widest">S2</div>
                            <div class="set-header py-2 text-center text-[10px] opacity-70 uppercase tracking-widest">TOTAL</div>
                            
                            <!-- Theo Row -->
                            <div class="px-5 py-4 uppercase tracking-wide player-row">Theo</div>
                            <div class="py-4 text-center score-val player-row">${t.scores.Theo[0]}</div>
                            <div class="py-4 text-center score-val player-row">${t.scores.Theo[1]}</div>
                            <div class="py-4 text-center score-val bg-white/10 player-row">${t.scores.Theo[0] + t.scores.Theo[1]}</div>
                            
                            <!-- Ben Row -->
                            <div class="px-5 py-4 uppercase tracking-wide">Ben</div>
                            <div class="py-4 text-center score-val">${t.scores.Ben[0]}</div>
                            <div class="py-4 text-center score-val">${t.scores.Ben[1]}</div>
                            <div class="py-4 text-center score-val bg-white/10">${t.scores.Ben[0] + t.scores.Ben[1]}</div>
                        </div>`;
                } else {
                    // Upcoming match display
                    div.className = "bg-white rounded-xl p-8 shadow-sm border-l-8 border-emerald-500 flex items-center justify-between";
                    div.innerHTML = `
                        <div>
                            <h2 class="text-2xl font-bold text-slate-800">${t.name}</h2>
                            <p class="text-emerald-600 font-semibold mt-1">Upcoming Tournament</p>
                        </div>
                        <div class="text-sm font-black text-slate-400 tracking-widest">${t.date.toUpperCase()}</div>`;
                }
                list.appendChild(div);
            });
        }

        // Initialize display
        window.onload = renderData;
    </script>
</body>
</html>
